# AT-SPI accessibility regression check on Linux.
# Exercises the accessibility tree used by Orca and other screen readers.

name: Accessibility (AT-SPI)

on:
  push:
    branches: [feature/gui-accessibility]
  pull_request:
  workflow_dispatch:

jobs:
  atspi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build + accessibility deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev \
            libbotan-2-dev zlib1g-dev libminizip-dev libargon2-dev libqrencode-dev libreadline-dev \
            libpcsclite-dev libusb-1.0-0-dev libkeyutils-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi-dev libxtst-dev libx11-dev \
            xvfb fluxbox dbus-x11 at-spi2-core gir1.2-atspi-2.0 python3-gi x11-utils

      - name: Configure + build
        run: |
          cmake -G Ninja -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_TESTS=ON \
            -DWITH_GUI_TESTS=ON \
            -DKPXC_FEATURE_NETWORK=OFF \
            -DKPXC_FEATURE_UPDATES=OFF \
            -DKPXC_FEATURE_DOCS=OFF
          ninja -C build-debug

      - name: Run accessibility tree check
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          sleep 1
          export DISPLAY=:99

          cat > /tmp/run-atspi-check.sh <<'ATSPISCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          fluxbox >/dev/null 2>&1 &
          sleep 1
          gsettings set org.gnome.desktop.interface toolkit-accessibility true

          export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          export QT_ACCESSIBILITY=1
          export QT_QPA_PLATFORM=xcb
          export QT_LOGGING_RULES="qt.accessibility.*=true"

          echo "=== Accessibility environment ==="
          echo "DISPLAY=$DISPLAY"
          echo "QT_ACCESSIBILITY=$QT_ACCESSIBILITY"
          echo "QT_LINUX_ACCESSIBILITY_ALWAYS_ON=$QT_LINUX_ACCESSIBILITY_ALWAYS_ON"
          echo "toolkit-accessibility=$(gsettings get org.gnome.desktop.interface toolkit-accessibility)"

          echo "=== Starting AT-SPI bus launcher ==="
          if [ -x /usr/libexec/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/libexec/at-spi-bus-launcher
          elif [ -x /usr/lib/at-spi2-core/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/lib/at-spi2-core/at-spi-bus-launcher
          else
            AT_SPI_LAUNCHER="$(command -v at-spi-bus-launcher)"
          fi
          echo "AT_SPI_LAUNCHER=$AT_SPI_LAUNCHER"
          # Let the bus launcher manage the session + registry (session-aware mode).
          "$AT_SPI_LAUNCHER" --launch-immediately >/tmp/at-spi-bus-launcher.log 2>&1 &
          ATSPI_LAUNCHER_PID=$!
          sleep 2
          cat /tmp/at-spi-bus-launcher.log || true

          echo "=== Discovering AT-SPI bus ==="
          AT_SPI_BUS_ADDRESS="$(busctl --user call org.a11y.Bus /org/a11y/bus org.a11y.Bus GetAddress | sed -n 's/^s "\(.*\)"$/\1/p')"
          if [ -z "$AT_SPI_BUS_ADDRESS" ]; then
            echo "ERROR: org.a11y.Bus did not return an AT-SPI bus address"
            exit 1
          fi
          export AT_SPI_BUS_ADDRESS
          export ATSPI_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS"
          echo "AT_SPI_BUS_ADDRESS=$AT_SPI_BUS_ADDRESS"

          echo "=== Waiting for AT-SPI bus socket ==="
          AT_SPI_SOCKET="$(printf '%s\n' "$AT_SPI_BUS_ADDRESS" | sed -n 's/^unix:path=\([^,]*\).*$/\1/p')"
          if [ -z "$AT_SPI_SOCKET" ]; then
            echo "ERROR: Could not extract AT-SPI Unix socket from bus address"
            exit 1
          fi
          echo "AT_SPI_SOCKET=$AT_SPI_SOCKET"
          for i in {1..15}; do
            if [ -S "$AT_SPI_SOCKET" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -S "$AT_SPI_SOCKET" ]; then
            echo "ERROR: AT-SPI bus socket did not appear"
            ls -la "$(dirname "$AT_SPI_SOCKET")" 2>&1 || true
            cat /tmp/at-spi-bus-launcher.log || true
            exit 1
          fi

          echo "=== Publishing AT-SPI X11 root property ==="
          for i in {1..10}; do
            if xdpyinfo >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          if ! xdpyinfo >/dev/null 2>&1; then
            echo "ERROR: X display $DISPLAY is not reachable"
            cat /tmp/xvfb.log || true
            exit 1
          fi
          XPROP_OK=0
          for i in {1..5}; do
            if xprop -root -f AT_SPI_BUS 8s -set AT_SPI_BUS "$AT_SPI_BUS_ADDRESS" 2>/tmp/xprop.err; then
              XPROP_OK=1
              break
            fi
            echo "xprop attempt $i failed: $(cat /tmp/xprop.err 2>/dev/null || true)"
            sleep 1
          done
          if [ "$XPROP_OK" -ne 1 ]; then
            echo "ERROR: failed to set AT_SPI_BUS X11 root property"
            cat /tmp/xprop.err || true
            exit 1
          fi
          xprop -root | grep AT_SPI_BUS

          echo "=== Ensuring AT-SPI registry (session-aware) ==="
          # Prefer registry already started by the bus launcher.
          # If missing, start it on the accessibility bus explicitly.
          AT_SPI_REGISTRY=/usr/libexec/at-spi2-registryd
          if [ ! -x "$AT_SPI_REGISTRY" ]; then
            AT_SPI_REGISTRY="$(command -v at-spi2-registryd)"
          fi
          echo "AT_SPI_REGISTRY=$AT_SPI_REGISTRY"

          if ! busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null \
              | awk '$1 == "org.a11y.atspi.Registry" {found=1} END {exit !found}'; then
            echo "Registry not present yet; starting it"
            # Start on the a11y bus so Embed()/Socket work.
            DBUS_SESSION_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS" \
              "$AT_SPI_REGISTRY" >/tmp/at-spi-registryd.log 2>&1 &
            ATSPIS_REGISTRY_PID=$!
          else
            echo "Registry already present on accessibility bus"
            ATSPIS_REGISTRY_PID=""
          fi

          echo "=== Waiting for AT-SPI registry Socket ==="
          REGISTRY_READY=0
          for i in {1..20}; do
            if busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null \
                | awk '$1 == "org.a11y.atspi.Registry" {found=1} END {exit !found}'; then
              # Qt's AtSpiAdaptor calls Embed() on the Socket interface at
              # /org/a11y/atspi/accessible/root. Do not accept the Registry
              # interface at /org/a11y/atspi/registry as a substitute.
              if busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
                  org.a11y.atspi.Registry /org/a11y/atspi/accessible/root 2>/dev/null \
                  | grep -q 'org.a11y.atspi.Socket'; then
                REGISTRY_READY=1
                break
              fi
            fi
            if [ -n "${ATSPIS_REGISTRY_PID:-}" ] && ! kill -0 "$ATSPIS_REGISTRY_PID" 2>/dev/null; then
              echo "ERROR: AT-SPI registry daemon exited"
              cat /tmp/at-spi-registryd.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$REGISTRY_READY" -ne 1 ]; then
            echo "ERROR: AT-SPI registry Socket not ready"
            echo "=== Bus services ==="
            busctl --address="$AT_SPI_BUS_ADDRESS" list 2>&1 || true
            echo "=== Registry introspection (root) ==="
            busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
              org.a11y.atspi.Registry /org/a11y/atspi/accessible/root 2>&1 || true
            echo "=== Registry introspection (/registry) ==="
            busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
              org.a11y.atspi.Registry /org/a11y/atspi/registry 2>&1 || true
            cat /tmp/at-spi-registryd.log || true
            cat /tmp/at-spi-bus-launcher.log || true
            exit 1
          fi
          echo "AT-SPI registry Socket is ready"
          busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
            org.a11y.atspi.Registry /org/a11y/atspi/accessible/root 2>&1 || true

          echo "=== Launching KeePassXC ==="
          ./build-debug/src/keepassxc >/tmp/keepassxc.log 2>&1 &
          APP_PID=$!

          echo "=== Waiting for KeePassXC on the AT-SPI bus ==="
          KEEPASS_BUS_NAME=""
          for i in {1..30}; do
            KEEPASS_BUS_NAME="$(busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$3 == "keepassxc" {print $1; exit}')"
            if [ -n "$KEEPASS_BUS_NAME" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$KEEPASS_BUS_NAME" ]; then
            echo "ERROR: KeePassXC did not appear on the AT-SPI bus"
            echo "=== Bus launcher log ==="
            cat /tmp/at-spi-bus-launcher.log || true
            echo "=== Registry log ==="
            cat /tmp/at-spi-registryd.log || true
            echo "=== AT-SPI bus services ==="
            busctl --address="$AT_SPI_BUS_ADDRESS" list 2>&1 || true
            echo "=== KeePassXC log ==="
            cat /tmp/keepassxc.log || true
            exit 1
          fi
          echo "KEEPASS_BUS_NAME=$KEEPASS_BUS_NAME"

          echo "=== Waiting for KeePassXC accessibility root ==="
          for i in {1..30}; do
            if busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
                "$KEEPASS_BUS_NAME" /org/a11y/atspi/accessible/root 2>/dev/null \
                | grep -q 'org.a11y.atspi.Accessible'; then
              break
            fi
            sleep 1
          done

          echo "=== KeePassXC AT-SPI root ==="
          if ! busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
              "$KEEPASS_BUS_NAME" /org/a11y/atspi/accessible/root; then
            echo "ERROR: KeePassXC accessibility root was not available"
            echo "=== AT-SPI bus services ==="
            busctl --address="$AT_SPI_BUS_ADDRESS" list 2>&1 || true
            echo "=== Registry introspection ==="
            busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
              org.a11y.atspi.Registry /org/a11y/atspi/accessible/root 2>&1 || true
            echo "=== Registry log ==="
            cat /tmp/at-spi-registryd.log || true
            echo "=== KeePassXC log ==="
            cat /tmp/keepassxc.log || true
            exit 1
          fi

          echo "=== KeePassXC AT-SPI cache ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
            "$KEEPASS_BUS_NAME" /org/a11y/atspi/cache || true

          echo "=== Qt accessibility evidence ==="
          grep -E 'name="(KeePassXC|Database toolbar|Search|Create Database|Open Database|Toggle Password|Generate Password|New Entry|Edit Entry|Delete Entry|Copy Username|Copy Password|Perform Auto-Type|Copy URL|Lock Database)"' \
            /tmp/keepassxc.log | head -50 || true

          echo "=== Direct libatspi probe ==="
          python3 - <<'PY'
          import os
          import time
          import gi
          gi.require_version("Atspi", "2.0")
          from gi.repository import Atspi

          print(f"AT_SPI_BUS_ADDRESS={os.environ.get('AT_SPI_BUS_ADDRESS')}")
          print(f"ATSPI_BUS_ADDRESS={os.environ.get('ATSPI_BUS_ADDRESS')}")
          print(f"Atspi version={Atspi.get_version()}")

          result = Atspi.init()
          print(f"Atspi.init() result={result}")
          found = False

          for attempt in range(30):
              desktop = Atspi.get_desktop(0)
              if desktop is not None:
                  count = desktop.get_child_count()
                  print(f"AT-SPI desktop child count={count} (attempt {attempt + 1})")
                  for index in range(count):
                      child = desktop.get_child_at_index(index)
                      if child is None:
                          continue
                      name = child.get_name() or "(unnamed)"
                      role = child.get_role_name() or "(unknown)"
                      print(f"AT-SPI application: name={name!r} role={role!r}")
                      if name.lower() == "keepassxc":
                          found = True
                          break
              if found:
                  break
              time.sleep(1)

          if not found:
              raise SystemExit("KeePassXC was not visible through the modern libatspi binding")

          print("Direct libatspi probe: KeePassXC is visible")
          Atspi.exit()
          PY

          echo "=== KeePassXC process status ==="
          ps -p "$APP_PID" -o pid=,stat=,cmd=

          kill "$APP_PID" 2>/dev/null || true
          [ -n "${ATSPIS_REGISTRY_PID:-}" ] && kill "$ATSPIS_REGISTRY_PID" 2>/dev/null || true
          kill "$ATSPI_LAUNCHER_PID" 2>/dev/null || true
          ATSPISCRIPT

          chmod +x /tmp/run-atspi-check.sh
          dbus-run-session -- /tmp/run-atspi-check.sh

      - name: Upload AT-SPI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-diagnostics
          path: |
            /tmp/keepassxc.log
            /tmp/at-spi-bus-launcher.log
            /tmp/at-spi-registryd.log
            /tmp/xvfb.log
          if-no-files-found: ignore
