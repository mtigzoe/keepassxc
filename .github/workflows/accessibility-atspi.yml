# Target path in the repo: .github/workflows/accessibility-atspi.yml
#
# Best-effort accessibility regression check via Linux AT-SPI + dogtail.
# Exercises the same accessible tree that Orca/screen readers read from,
# without needing real screen-reader hardware.
#
# CAVEAT: continue-on-error is deliberate for now, but it's scoped to
# only the "Run accessibility tree check" step below -- NOT the whole
# job. run-tests.sh (in keepassxc-build-scripts) already documents that
# even Xvfb + fluxbox can fail to deliver real focus events reliably in
# a throwaway CI session, so treat a failure in that one step as
# "investigate", not "confirmed regression", until it's proven stable
# over several runs. Flip its continue-on-error off once it has. A
# failure in any other step (deps, build) should still fail the job
# normally -- it means something is actually broken, not flaky.

name: Accessibility (AT-SPI)

on:
  push:
    branches: [feature/gui-accessibility]
  pull_request:
  workflow_dispatch:

jobs:
  atspi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build + accessibility deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev \
            libbotan-2-dev zlib1g-dev libminizip-dev libargon2-dev libqrencode-dev libreadline-dev \
            libpcsclite-dev libusb-1.0-0-dev libkeyutils-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi-dev libxtst-dev libx11-dev \
            xvfb fluxbox dbus-x11 at-spi2-core python3-dogtail python3-pyatspi

      - name: Configure + build
        run: |
          cmake -G Ninja -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_TESTS=ON \
            -DWITH_GUI_TESTS=ON \
            -DKPXC_FEATURE_NETWORK=OFF \
            -DKPXC_FEATURE_UPDATES=OFF \
            -DKPXC_FEATURE_DOCS=OFF
          ninja -C build-debug

      - name: Run accessibility tree check
        continue-on-error: true
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 1
          export DISPLAY=:99
          dbus-run-session -- bash -c '
            fluxbox >/dev/null 2>&1 &
            sleep 1

            # Dogtail checks GNOME's toolkit-accessibility setting before
            # connecting to AT-SPI. CI uses Fluxbox rather than GNOME, so
            # explicitly enable the setting in this temporary D-Bus session.
            gsettings set org.gnome.desktop.interface toolkit-accessibility true

            export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
            export QT_ACCESSIBILITY=1
            export QT_QPA_PLATFORM=xcb

            echo "=== Accessibility environment ==="
            echo "QT_LINUX_ACCESSIBILITY_ALWAYS_ON=$QT_LINUX_ACCESSIBILITY_ALWAYS_ON"
            echo "QT_ACCESSIBILITY=$QT_ACCESSIBILITY"
            echo "QT_QPA_PLATFORM=$QT_QPA_PLATFORM"
            echo "toolkit-accessibility=$(gsettings get org.gnome.desktop.interface toolkit-accessibility)"
            echo "=== AT-SPI services before app launch ==="
            busctl --user list | grep -E 'atspi|a11y' || true
            echo "=== Qt version ==="
            qmake6 -query QT_VERSION || true
            echo "=== Qt accessibility plugins ==="
            find /usr/lib /usr/local/lib -type f \( -iname '*accessib*' -o -path '*/accessiblebridge/*' \) 2>/dev/null | sort || true
            echo "=== Qt plugin directories ==="
            qmake6 -query QT_INSTALL_PLUGINS || true
            echo "=== AT-SPI libraries ==="
            ldconfig -p | grep -E 'libatspi|libatk-bridge' || true

            ./build-debug/src/keepassxc &
            APP_PID=$!
            sleep 3

            echo "=== KeePassXC process environment ==="
            tr '\0' '\n' < "/proc/$APP_PID/environ" | grep -E '^(QT_|DISPLAY|DBUS_)' | sort || true
            echo "=== AT-SPI services after app launch ==="
            busctl --user list | grep -E 'atspi|a11y' || true
            echo "=== KeePassXC process status ==="
            ps -p "$APP_PID" -o pid=,stat=,cmd=

            python3 tests/accessibility/dump_tree.py
            STATUS=$?
            kill "$APP_PID" 2>/dev/null || true
            exit $STATUS
          '

      - name: Upload tree dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-tree-dump
          path: atspi-tree-dump.txt
          if-no-files-found: ignore
