# Target path in the repo: .github/workflows/accessibility-atspi.yml
#
# Best-effort accessibility regression check via Linux AT-SPI.
# Exercises the same accessible tree that Orca/screen readers read from,
# without needing real screen-reader hardware.
#
# CAVEAT: continue-on-error is deliberate for now, but it's scoped to
# only the "Run accessibility tree check" step below -- NOT the whole
# job. Treat a failure in that one step as "investigate" until the
# headless AT-SPI session is proven stable over several runs.

name: Accessibility (AT-SPI)

on:
  push:
    branches: [feature/gui-accessibility]
  pull_request:
  workflow_dispatch:

jobs:
  atspi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build + accessibility deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev \
            libbotan-2-dev zlib1g-dev libminizip-dev libargon2-dev libqrencode-dev libreadline-dev \
            libpcsclite-dev libusb-1.0-0-dev libkeyutils-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi-dev libxtst-dev libx11-dev \
            xvfb fluxbox dbus-x11 at-spi2-core gir1.2-atspi-2.0 python3-gi x11-utils

      - name: Configure + build
        run: |
          cmake -G Ninja -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_TESTS=ON \
            -DWITH_GUI_TESTS=ON \
            -DKPXC_FEATURE_NETWORK=OFF \
            -DKPXC_FEATURE_UPDATES=OFF \
            -DKPXC_FEATURE_DOCS=OFF
          ninja -C build-debug

      - name: Run accessibility tree check
        continue-on-error: true
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 1
          export DISPLAY=:99

          cat > /tmp/run-atspi-check.sh <<'ATSPISCRIPT'
          #!/usr/bin/env bash
          set -e

          fluxbox >/dev/null 2>&1 &
          sleep 1
          gsettings set org.gnome.desktop.interface toolkit-accessibility true

          export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          export QT_ACCESSIBILITY=1
          export QT_QPA_PLATFORM=xcb
          export QT_LOGGING_RULES="qt.accessibility.*=true"

          echo "=== Accessibility environment ==="
          echo "QT_LINUX_ACCESSIBILITY_ALWAYS_ON=$QT_LINUX_ACCESSIBILITY_ALWAYS_ON"
          echo "QT_ACCESSIBILITY=$QT_ACCESSIBILITY"
          echo "QT_QPA_PLATFORM=$QT_QPA_PLATFORM"
          echo "QT_LOGGING_RULES=$QT_LOGGING_RULES"
          echo "toolkit-accessibility=$(gsettings get org.gnome.desktop.interface toolkit-accessibility)"
          echo "=== D-Bus environment ==="
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          env | grep '^DBUS_' | sort || true

          echo "=== Starting AT-SPI bus launcher ==="
          if [ -x /usr/libexec/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/libexec/at-spi-bus-launcher
          elif [ -x /usr/lib/at-spi2-core/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/lib/at-spi2-core/at-spi-bus-launcher
          else
            AT_SPI_LAUNCHER="$(command -v at-spi-bus-launcher)"
          fi
          echo "AT_SPI_LAUNCHER=$AT_SPI_LAUNCHER"
          "$AT_SPI_LAUNCHER" --launch-immediately >/tmp/at-spi-bus-launcher.log 2>&1 &
          ATSPI_LAUNCHER_PID=$!
          sleep 2
          echo "AT-SPI launcher PID=$ATSPI_LAUNCHER_PID"
          cat /tmp/at-spi-bus-launcher.log || true

          echo "=== AT-SPI services after launcher ==="
          busctl --user list | grep -E 'atspi|a11y' || true
          echo "=== AT-SPI bus address ==="
          AT_SPI_BUS_ADDRESS="$(busctl --user call org.a11y.Bus /org/a11y/bus org.a11y.Bus GetAddress | sed -n 's/^s "\(.*\)"$/\1/p')"
          if [ -z "$AT_SPI_BUS_ADDRESS" ]; then
            echo "ERROR: org.a11y.Bus did not return an AT-SPI bus address"
            exit 1
          fi
          export AT_SPI_BUS_ADDRESS
          export ATSPI_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS"
          echo "AT_SPI_BUS_ADDRESS=$AT_SPI_BUS_ADDRESS"
          echo "ATSPI_BUS_ADDRESS=$ATSPI_BUS_ADDRESS"

          echo "=== Setting AT-SPI X11 root property ==="
          xprop -root -f AT_SPI_BUS 8s -set AT_SPI_BUS "$AT_SPI_BUS_ADDRESS"
          xprop -root | grep AT_SPI_BUS || true

          echo "=== Waiting for AT-SPI registry ==="
          for i in {1..20}; do
            if busctl --address="$AT_SPI_BUS_ADDRESS" list | grep -q 'org.a11y.atspi.Registry'; then
              break
            fi
            sleep 1
          done
          if ! busctl --address="$AT_SPI_BUS_ADDRESS" list | grep -q 'org.a11y.atspi.Registry'; then
            echo "ERROR: org.a11y.atspi.Registry did not appear on the AT-SPI bus"
            exit 1
          fi
          busctl --address="$AT_SPI_BUS_ADDRESS" list | grep -Ei 'org.a11y.atspi.Registry|atspi' || true

          echo "=== AT-SPI registry Socket root ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
            org.a11y.atspi.Registry /org/a11y/atspi/accessible/root 2>&1 || true

          echo "=== Qt version ==="
          qmake6 -query QT_VERSION || true
          echo "=== Qt accessibility plugins ==="
          find /usr/lib/qt6 /usr/lib/x86_64-linux-gnu/qt6 -type f \( -iname '*accessib*' -o -path '*/accessiblebridge/*' \) 2>/dev/null | sort || true
          echo "=== AT-SPI libraries ==="
          ldconfig -p | grep -E 'libatspi|libatk-bridge' || true

          ./build-debug/src/keepassxc &
          APP_PID=$!
          sleep 3

          echo "=== KeePassXC process environment ==="
          tr '\0' '\n' < "/proc/$APP_PID/environ" | grep -E '^(QT_|DISPLAY|DBUS_|AT_SPI_|ATSPI_)' | sort || true
          echo "=== AT-SPI bus contents ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" list || true

          KEEPASS_BUS_NAME="$(busctl --address="$AT_SPI_BUS_ADDRESS" list | awk '$3 == "keepassxc" {print $1; exit}')"
          echo "KEEPASS_BUS_NAME=$KEEPASS_BUS_NAME"
          if [ -z "$KEEPASS_BUS_NAME" ]; then
            echo "ERROR: KeePassXC did not appear on the AT-SPI bus"
            exit 1
          fi

          echo "=== KeePassXC AT-SPI root ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
            "$KEEPASS_BUS_NAME" /org/a11y/atspi/accessible/root 2>&1 || true
          echo "=== KeePassXC AT-SPI cache ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" introspect \
            "$KEEPASS_BUS_NAME" /org/a11y/atspi/cache 2>&1 || true
          echo "=== KeePassXC AT-SPI cache GetItems ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" call \
            "$KEEPASS_BUS_NAME" /org/a11y/atspi/cache \
            org.a11y.atspi.Cache GetItems 2>&1 || true

          echo "=== Python AT-SPI environment ==="
          python3 - <<'PY'
          import os
          print(f"AT_SPI_BUS_ADDRESS={os.environ.get('AT_SPI_BUS_ADDRESS')}")
          print(f"ATSPI_BUS_ADDRESS={os.environ.get('ATSPI_BUS_ADDRESS')}")
          print(f"DBUS_SESSION_BUS_ADDRESS={os.environ.get('DBUS_SESSION_BUS_ADDRESS')}")
          PY

          echo "=== Direct libatspi probe ==="
          python3 - <<'PY'
          import os
          import gi
          gi.require_version("Atspi", "2.0")
          from gi.repository import Atspi

          print(f"AT_SPI_BUS_ADDRESS={os.environ.get('AT_SPI_BUS_ADDRESS')}")
          print(f"ATSPI_BUS_ADDRESS={os.environ.get('ATSPI_BUS_ADDRESS')}")
          print(f"DISPLAY={os.environ.get('DISPLAY')}")
          print(f"Atspi version={Atspi.get_version()}")
          result = Atspi.init()
          print(f"Atspi.init() result={result}")
          desktop = Atspi.get_desktop(0)

          found = False
          if desktop is not None:
              count = desktop.get_child_count()
              print(f"AT-SPI desktop child count={count}")
              for index in range(count):
                  child = desktop.get_child_at_index(index)
                  if child is None:
                      continue
                  name = child.get_name() or "(unnamed)"
                  role = child.get_role_name() or "(unknown)"
                  print(f"AT-SPI application: name={name!r} role={role!r}")
                  if name.lower() == "keepassxc":
                      found = True

          if not found:
              raise SystemExit("KeePassXC was not visible through the modern libatspi binding")

          print("Direct libatspi probe: KeePassXC is visible")
          Atspi.exit()
          PY

          echo "=== KeePassXC process status ==="
          ps -p "$APP_PID" -o pid=,stat=,cmd=

          kill "$APP_PID" 2>/dev/null || true
          kill "$ATSPI_LAUNCHER_PID" 2>/dev/null || true
          ATSPISCRIPT

          chmod +x /tmp/run-atspi-check.sh
          dbus-run-session -- /tmp/run-atspi-check.sh

      - name: Upload tree dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-tree-dump
          path: atspi-tree-dump.txt
          if-no-files-found: ignore
