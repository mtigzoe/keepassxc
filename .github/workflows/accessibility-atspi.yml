# AT-SPI accessibility regression check on Linux.
# Exercises the accessibility tree used by Orca and other screen readers.

name: Accessibility (AT-SPI)

on:
  push:
    branches: [feature/gui-accessibility]
  pull_request:
  workflow_dispatch:

jobs:
  atspi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build + accessibility deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev \
            libbotan-2-dev zlib1g-dev libminizip-dev libargon2-dev libqrencode-dev libreadline-dev \
            libpcsclite-dev libusb-1.0-0-dev libkeyutils-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi-dev libxtst-dev libx11-dev \
            xvfb fluxbox dbus-x11 at-spi2-core gir1.2-atspi-2.0 python3-gi x11-utils libglib2.0-bin

      - name: Configure + build
        run: |
          cmake -G Ninja -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_TESTS=ON \
            -DWITH_GUI_TESTS=ON \
            -DKPXC_FEATURE_NETWORK=OFF \
            -DKPXC_FEATURE_UPDATES=OFF \
            -DKPXC_FEATURE_DOCS=OFF
          ninja -C build-debug

      - name: Run AT-SPI accessibility tree check
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 1
          export DISPLAY=:99

          cat > /tmp/run-atspi-check.sh <<'ATSPISCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          fluxbox >/dev/null 2>&1 &
          FLUXBOX_PID=$!
          sleep 1
          gsettings set org.gnome.desktop.interface toolkit-accessibility true

          export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          export QT_ACCESSIBILITY=1
          export QT_QPA_PLATFORM=xcb
          export QT_LOGGING_RULES="qt.accessibility.*=true"

          echo "=== Accessibility environment ==="
          echo "DISPLAY=$DISPLAY"
          echo "QT_ACCESSIBILITY=$QT_ACCESSIBILITY"
          echo "QT_LINUX_ACCESSIBILITY_ALWAYS_ON=$QT_LINUX_ACCESSIBILITY_ALWAYS_ON"
          echo "toolkit-accessibility=$(gsettings get org.gnome.desktop.interface toolkit-accessibility)"

          echo "=== Starting AT-SPI bus launcher ==="
          if [ -x /usr/libexec/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/libexec/at-spi-bus-launcher
          elif [ -x /usr/lib/at-spi2-core/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/lib/at-spi2-core/at-spi-bus-launcher
          else
            AT_SPI_LAUNCHER="$(command -v at-spi-bus-launcher)"
          fi
          "$AT_SPI_LAUNCHER" --launch-immediately >/tmp/at-spi-bus-launcher.log 2>&1 &
          ATSPI_LAUNCHER_PID=$!
          sleep 2

          echo "=== Discovering AT-SPI bus ==="
          AT_SPI_BUS_ADDRESS="$(busctl --user call org.a11y.Bus /org/a11y/bus org.a11y.Bus GetAddress | sed -n 's/^s "\(.*\)"$/\1/p')"
          if [ -z "$AT_SPI_BUS_ADDRESS" ]; then
            echo "ERROR: org.a11y.Bus did not return an AT-SPI bus address"
            exit 1
          fi
          export AT_SPI_BUS_ADDRESS
          export ATSPI_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS"
          echo "AT_SPI_BUS_ADDRESS=$AT_SPI_BUS_ADDRESS"

          AT_SPI_SOCKET="$(printf '%s\n' "$AT_SPI_BUS_ADDRESS" | sed -n 's/^unix:path=\([^,]*\).*$/\1/p')"
          if [ -z "$AT_SPI_SOCKET" ]; then
            echo "ERROR: Could not extract AT-SPI Unix socket from bus address"
            exit 1
          fi
          for i in {1..15}; do
            [ -S "$AT_SPI_SOCKET" ] && break
            sleep 1
          done
          if [ ! -S "$AT_SPI_SOCKET" ]; then
            echo "ERROR: AT-SPI bus socket did not appear"
            cat /tmp/at-spi-bus-launcher.log || true
            exit 1
          fi

          echo "=== Ensuring AT-SPI registry ==="
          AT_SPI_REGISTRY=/usr/libexec/at-spi2-registryd
          if [ ! -x "$AT_SPI_REGISTRY" ]; then
            AT_SPI_REGISTRY="$(command -v at-spi2-registryd)"
          fi
          if ! busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$1 == "org.a11y.atspi.Registry" {found=1} END {exit !found}'; then
            DBUS_SESSION_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS" "$AT_SPI_REGISTRY" >/tmp/at-spi-registryd.log 2>&1 &
            ATSPIS_REGISTRY_PID=$!
          else
            ATSPIS_REGISTRY_PID=""
          fi

          REGISTRY_READY=0
          for i in {1..20}; do
            if busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$1 == "org.a11y.atspi.Registry" {found=1} END {exit !found}'; then
              if gdbus introspect --address="$AT_SPI_BUS_ADDRESS" \
                  --dest org.a11y.atspi.Registry \
                  --object-path /org/a11y/atspi/accessible/root 2>/dev/null \
                  | grep -q 'org.a11y.atspi.Socket'; then
                REGISTRY_READY=1
                break
              fi
            fi
            if [ -n "${ATSPIS_REGISTRY_PID:-}" ] && ! kill -0 "$ATSPIS_REGISTRY_PID" 2>/dev/null; then
              echo "ERROR: AT-SPI registry daemon exited"
              cat /tmp/at-spi-registryd.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$REGISTRY_READY" -ne 1 ]; then
            echo "ERROR: AT-SPI registry Socket not ready"
            busctl --address="$AT_SPI_BUS_ADDRESS" list 2>&1 || true
            gdbus introspect --address="$AT_SPI_BUS_ADDRESS" --dest org.a11y.atspi.Registry \
              --object-path /org/a11y/atspi/accessible/root 2>&1 || true
            cat /tmp/at-spi-registryd.log || true
            exit 1
          fi
          echo "AT-SPI registry Socket is ready"

          echo "=== Launching KeePassXC ==="
          ./build-debug/src/keepassxc >/tmp/keepassxc.log 2>&1 &
          APP_PID=$!

          echo "=== Waiting for KeePassXC on the AT-SPI bus ==="
          KEEPASS_BUS_NAME=""
          for i in {1..30}; do
            KEEPASS_BUS_NAME="$(busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$3 == "keepassxc" {print $1; exit}')"
            [ -n "$KEEPASS_BUS_NAME" ] && break
            sleep 1
          done
          if [ -z "$KEEPASS_BUS_NAME" ]; then
            echo "ERROR: KeePassXC did not appear on the AT-SPI bus"
            cat /tmp/keepassxc.log || true
            exit 1
          fi
          echo "KEEPASS_BUS_NAME=$KEEPASS_BUS_NAME"

          echo "=== Direct AT-SPI application-root accessibility probe ==="
          # AT-SPI applications expose a root Accessible object at the standard
          # /org/a11y/atspi/accessible/root path. The registry also exposes a
          # root path, so the application bus name must be used here.
          DBUS_SESSION_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS" python3 - "$KEEPASS_BUS_NAME" <<'PY'
          import os
          import sys
          import time
          import gi
          gi.require_version("Gio", "2.0")
          from gi.repository import Gio

          bus_name = sys.argv[1]
          address = os.environ["DBUS_SESSION_BUS_ADDRESS"]
          root_path = "/org/a11y/atspi/accessible/root"
          accessible_iface = "org.a11y.atspi.Accessible"

          print(f"DBUS_SESSION_BUS_ADDRESS={address}")
          print(f"AT_SPI_BUS_ADDRESS={os.environ.get('AT_SPI_BUS_ADDRESS')}")
          print(f"KeePassXC AT-SPI bus name={bus_name}")

          connection = Gio.DBusConnection.new_for_address_sync(
              address,
              Gio.DBusConnectionFlags.AUTHENTICATION_CLIENT
              | Gio.DBusConnectionFlags.MESSAGE_BUS_CONNECTION,
              None,
              None,
          )

          def call(path, method):
              return connection.call_sync(
                  bus_name,
                  path,
                  accessible_iface,
                  method,
                  None,
                  None,
                  Gio.DBusCallFlags.NONE,
                  5000,
                  None,
              )

          def get_name(path):
              return call(path, "GetName").unpack()[0]

          def get_children(path):
              return list(call(path, "GetChildren").unpack()[0])

          found_names = set()
          queue = [(root_path, 0)]
          visited = set()
          max_nodes = 2000

          for attempt in range(15):
              found_names.clear()
              queue = [(root_path, 0)]
              visited.clear()
              nodes = 0
              try:
                  while queue and nodes < max_nodes:
                      path, depth = queue.pop(0)
                      if path in visited:
                          continue
                      visited.add(path)
                      nodes += 1
                      try:
                          name = get_name(path)
                      except Exception as exc:
                          print(f"GetName failed for {path}: {exc}")
                          continue
                      if name:
                          found_names.add(name)
                      if depth < 12:
                          try:
                              for child in get_children(path):
                                  child_bus, child_path = child
                                  if child_bus in ("", bus_name) and child_path not in visited:
                                      queue.append((child_path, depth + 1))
                          except Exception as exc:
                              print(f"GetChildren failed for {path}: {exc}")
                  print(f"AT-SPI application tree nodes visited={nodes}")
                  print(f"Observed required names: {sorted(found_names.intersection({'KeePassXC', 'Create Database', 'Open Database', 'Import File'}))}")
                  if "KeePassXC" in found_names and {"Create Database", "Open Database", "Import File"}.intersection(found_names):
                      print("KeePassXC accessibility objects are present in the AT-SPI application tree.")
                      raise SystemExit(0)
              except Exception as exc:
                  print(f"AT-SPI root probe attempt {attempt + 1} failed: {exc}")
              time.sleep(1)

          print("ERROR: KeePassXC accessibility objects were not found in the AT-SPI application tree")
          print(f"Observed names: {sorted(found_names)[:100]}")
          raise SystemExit(1)
          PY

          echo "KeePassXC is visible through the AT-SPI application tree."

          echo "=== Qt accessibility evidence ==="
          REQUIRED_ROOT_PATTERN='qt\.accessibility\.cache: insert.*name="KeePassXC".*role=Window'
          REQUIRED_CONTROL_PATTERNS=(
            'qt\.accessibility\.cache: insert.*name="Create Database"'
            'qt\.accessibility\.cache: insert.*name="Open Database"'
            'qt\.accessibility\.cache: insert.*name="Import File"'
          )
          CACHE_FALLBACK_OK=1
          grep -qE "$REQUIRED_ROOT_PATTERN" /tmp/keepassxc.log || CACHE_FALLBACK_OK=0
          MATCHED_CONTROLS=0
          for pattern in "${REQUIRED_CONTROL_PATTERNS[@]}"; do
            if grep -qE "$pattern" /tmp/keepassxc.log; then
              MATCHED_CONTROLS=$((MATCHED_CONTROLS + 1))
            fi
          done
          echo "Matched $MATCHED_CONTROLS/${#REQUIRED_CONTROL_PATTERNS[@]} required named controls in the accessibility cache trace."
          if [ "$CACHE_FALLBACK_OK" -ne 1 ] || [ "$MATCHED_CONTROLS" -lt 2 ]; then
            echo "ERROR: Qt accessibility cache evidence failed"
            cat /tmp/keepassxc.log || true
            exit 1
          fi
          echo "KeePassXC accessibility tree confirmed through Qt cache evidence."

          echo "=== AT-SPI application bus diagnostics ==="
          busctl --address="$AT_SPI_BUS_ADDRESS" tree "$KEEPASS_BUS_NAME" 2>&1 || true
          gdbus introspect --address="$AT_SPI_BUS_ADDRESS" --dest "$KEEPASS_BUS_NAME" \
            --object-path /org/a11y/atspi/accessible/root 2>&1 || true

          echo "=== KeePassXC process status ==="
          ps -p "$APP_PID" -o pid=,stat=,cmd=

          kill "$APP_PID" 2>/dev/null || true
          [ -n "${ATSPIS_REGISTRY_PID:-}" ] && kill "$ATSPIS_REGISTRY_PID" 2>/dev/null || true
          kill "$ATSPI_LAUNCHER_PID" 2>/dev/null || true
          kill "$FLUXBOX_PID" 2>/dev/null || true
          ATSPISCRIPT

          chmod +x /tmp/run-atspi-check.sh
          dbus-run-session -- /tmp/run-atspi-check.sh
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Upload AT-SPI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-diagnostics
          path: |
            /tmp/keepassxc.log
            /tmp/at-spi-bus-launcher.log
            /tmp/at-spi-registryd.log
            /tmp/xvfb.log
          if-no-files-found: ignore
