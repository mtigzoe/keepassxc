# AT-SPI accessibility regression check on Linux.
# Exercises the accessibility tree used by Orca and other screen readers.
#
# The application runs inside dbus-run-session so Qt can discover the
# accessibility bus through org.a11y.Bus on its normal session bus. We do not
# export AT_SPI_BUS_ADDRESS to KeePassXC because Qt 6.4 has a different
# initialization path for that override; the normal discovery path is the
# portable configuration for this CI environment.

name: Accessibility (AT-SPI)

on:
  push:
    branches: [feature/gui-accessibility]
  pull_request:
  workflow_dispatch:

jobs:
  atspi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build + accessibility deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git gdb \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev \
            libbotan-2-dev zlib1g-dev libminizip-dev libargon2-dev libqrencode-dev libreadline-dev \
            libpcsclite-dev libusb-1.0-0-dev libkeyutils-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi-dev libxtst-dev libx11-dev \
            xvfb fluxbox dbus-x11 at-spi2-core gir1.2-atspi-2.0 python3-gi python3-pytest \
            x11-utils libglib2.0-bin

      - name: Configure + build
        run: |
          cmake -G Ninja -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_TESTS=ON \
            -DWITH_GUI_TESTS=ON \
            -DKPXC_FEATURE_NETWORK=OFF \
            -DKPXC_FEATURE_UPDATES=OFF \
            -DKPXC_FEATURE_DOCS=OFF
          ninja -C build-debug

      - name: Run AT-SPI accessibility regression test
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 1
          export DISPLAY=:99

          cat > /tmp/run-atspi-test.sh <<'ATSPISCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          # Keep a core-dump limit available in case the runner/kernel permits
          # writing one. The gdb wrapper below is the primary crash diagnostic.
          ulimit -c unlimited || true
          echo 'core.%p' | sudo tee /proc/sys/kernel/core_pattern >/dev/null 2>&1 || true

          fluxbox >/dev/null 2>&1 &
          FLUXBOX_PID=$!
          sleep 1
          gsettings set org.gnome.desktop.interface toolkit-accessibility true

          export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          export QT_ACCESSIBILITY=1
          export QT_QPA_PLATFORM=xcb
          export QT_LOGGING_RULES="qt.accessibility.*=true;qt.qpa.*=true"
          export QT_DEBUG_PLUGINS=1

          echo "=== Accessibility environment ==="
          echo "DISPLAY=$DISPLAY"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
          echo "QT_ACCESSIBILITY=$QT_ACCESSIBILITY"
          echo "QT_LINUX_ACCESSIBILITY_ALWAYS_ON=$QT_LINUX_ACCESSIBILITY_ALWAYS_ON"
          echo "QT_QPA_PLATFORM=$QT_QPA_PLATFORM"
          echo "toolkit-accessibility=$(gsettings get org.gnome.desktop.interface toolkit-accessibility)"
          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern 2>/dev/null || true)"
          echo "core_limit=$(ulimit -c)"

          echo "=== Starting AT-SPI bus launcher ==="
          if [ -x /usr/libexec/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/libexec/at-spi-bus-launcher
          elif [ -x /usr/lib/at-spi2-core/at-spi-bus-launcher ]; then
            AT_SPI_LAUNCHER=/usr/lib/at-spi2-core/at-spi-bus-launcher
          else
            AT_SPI_LAUNCHER="$(command -v at-spi-bus-launcher)"
          fi
          "$AT_SPI_LAUNCHER" --launch-immediately >/tmp/at-spi-bus-launcher.log 2>&1 &
          ATSPI_LAUNCHER_PID=$!
          sleep 2

          echo "=== Discovering AT-SPI bus ==="
          AT_SPI_BUS_ADDRESS="$(busctl --user call org.a11y.Bus /org/a11y/bus org.a11y.Bus GetAddress | sed -n 's/^s "\(.*\)"$/\1/p')"
          if [ -z "$AT_SPI_BUS_ADDRESS" ]; then
            echo "ERROR: org.a11y.Bus did not return an AT-SPI bus address"
            exit 1
          fi
          echo "AT_SPI_BUS_ADDRESS=$AT_SPI_BUS_ADDRESS"

          echo "=== Enabling AT-SPI accessibility status ==="
          gdbus call --session \
            --dest org.a11y.Bus \
            --object-path /org/a11y/bus \
            --method org.freedesktop.DBus.Properties.Set \
            org.a11y.Status IsEnabled '<true>'
          gdbus call --session \
            --dest org.a11y.Bus \
            --object-path /org/a11y/bus \
            --method org.freedesktop.DBus.Properties.Set \
            org.a11y.Status ScreenReaderEnabled '<true>'
          gdbus call --session \
            --dest org.a11y.Bus \
            --object-path /org/a11y/bus \
            --method org.freedesktop.DBus.Properties.GetAll \
            org.a11y.Status

          AT_SPI_SOCKET="$(printf '%s\n' "$AT_SPI_BUS_ADDRESS" | sed -n 's/^unix:path=\([^,]*\).*$/\1/p')"
          if [ -z "$AT_SPI_SOCKET" ]; then
            echo "ERROR: Could not extract AT-SPI Unix socket from bus address"
            exit 1
          fi
          for i in {1..15}; do
            [ -S "$AT_SPI_SOCKET" ] && break
            sleep 1
          done
          if [ ! -S "$AT_SPI_SOCKET" ]; then
            echo "ERROR: AT-SPI bus socket did not appear"
            cat /tmp/at-spi-bus-launcher.log || true
            exit 1
          fi

          echo "=== Ensuring AT-SPI registry ==="
          AT_SPI_REGISTRY=/usr/libexec/at-spi2-registryd
          if [ ! -x "$AT_SPI_REGISTRY" ]; then
            AT_SPI_REGISTRY="$(command -v at-spi2-registryd)"
          fi
          if ! busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$1 == "org.a11y.atspi.Registry" {found=1} END {exit !found}'; then
            DBUS_SESSION_BUS_ADDRESS="$AT_SPI_BUS_ADDRESS" "$AT_SPI_REGISTRY" >/tmp/at-spi-registryd.log 2>&1 &
            ATSPI_REGISTRY_PID=$!
          else
            ATSPI_REGISTRY_PID=""
          fi

          REGISTRY_READY=0
          for i in {1..20}; do
            if busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$1 == "org.a11y.atspi.Registry" {found=1} END {exit !found}'; then
              if gdbus introspect --address="$AT_SPI_BUS_ADDRESS" \
                  --dest org.a11y.atspi.Registry \
                  --object-path /org/a11y/atspi/accessible/root 2>/dev/null \
                  | grep -q 'org.a11y.atspi.Socket'; then
                REGISTRY_READY=1
                break
              fi
            fi
            if [ -n "${ATSPI_REGISTRY_PID:-}" ] && ! kill -0 "$ATSPI_REGISTRY_PID" 2>/dev/null; then
              echo "ERROR: AT-SPI registry daemon exited"
              cat /tmp/at-spi-registryd.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$REGISTRY_READY" -ne 1 ]; then
            echo "ERROR: AT-SPI registry Socket not ready"
            busctl --address="$AT_SPI_BUS_ADDRESS" list 2>&1 || true
            gdbus introspect --address="$AT_SPI_BUS_ADDRESS" --dest org.a11y.atspi.Registry \
              --object-path /org/a11y/atspi/accessible/root 2>&1 || true
            cat /tmp/at-spi-registryd.log || true
            exit 1
          fi
          echo "AT-SPI registry Socket is ready"

          echo "=== Launching KeePassXC under gdb ==="
          # Running the GUI under gdb lets us capture the exact Qt/AT-SPI stack
          # when the application receives SIGSEGV. The debugger remains attached
          # while pytest exercises the accessibility API.
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'set logging file /tmp/keepassxc-gdb.txt' \
            -ex 'set logging overwrite on' \
            -ex 'set logging on' \
            -ex run \
            -ex 'echo \\n=== gdb crash/exit diagnostics ===\\n' \
            -ex 'info program' \
            -ex 'info signals' \
            -ex 'info registers' \
            -ex 'thread apply all bt full' \
            -ex 'set logging off' \
            --args ./build-debug/src/keepassxc >/tmp/keepassxc.log 2>&1 &
          APP_PID=$!
          sleep 2

          echo "=== KeePassXC environment ==="
          if [ -r "/proc/$APP_PID/environ" ]; then
            tr '\0' '\n' </proc/$APP_PID/environ | grep -E '^(DISPLAY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS|ATSPI_BUS_ADDRESS|QT_ACCESSIBILITY|QT_LINUX_ACCESSIBILITY_ALWAYS_ON|QT_QPA_PLATFORM|QT_DEBUG_PLUGINS)=' | sort || true
          else
            echo "gdb process environment is no longer available"
          fi

          echo "=== Running the AT-SPI accessibility regression test ==="
          set +e
          python3 -m pytest tests/accessibility/atspi/test_keepassxc_atspi.py -v \
            --junitxml=/tmp/atspi-test-results.xml
          TEST_EXIT=$?
          set -e

          echo "=== AT-SPI application bus diagnostics ==="
          KEEPASS_BUS_NAME="$(busctl --address="$AT_SPI_BUS_ADDRESS" list 2>/dev/null | awk '$3 == "keepassxc" {print $1; exit}')"
          if [ -n "$KEEPASS_BUS_NAME" ]; then
            busctl --address="$AT_SPI_BUS_ADDRESS" tree "$KEEPASS_BUS_NAME" 2>&1 || true
            gdbus introspect --address="$AT_SPI_BUS_ADDRESS" --dest "$KEEPASS_BUS_NAME" \
              --object-path /org/a11y/atspi/accessible/root 2>&1 || true
          else
            echo "KeePassXC never appeared on the AT-SPI bus as a named connection."
          fi

          echo "=== Qt accessibility diagnostics ==="
          grep -E 'QFactoryLoader|QSpi|AT-SPI|Accessibility|DBus|accessiblebridge|qspi|segmentation|SIGSEGV' /tmp/keepassxc.log || true

          echo "=== KeePassXC process status ==="
          ps -p "$APP_PID" -o pid=,stat=,cmd= || true

          echo "=== gdb backtrace ==="
          cat /tmp/keepassxc-gdb.txt 2>/dev/null || echo "No gdb diagnostic log was produced."

          echo "=== Core files ==="
          find . /tmp -maxdepth 2 -type f -name 'core*' -printf '%p %s bytes\\n' 2>/dev/null || true

          kill "$APP_PID" 2>/dev/null || true
          [ -n "${ATSPI_REGISTRY_PID:-}" ] && kill "$ATSPI_REGISTRY_PID" 2>/dev/null || true
          kill "$ATSPI_LAUNCHER_PID" 2>/dev/null || true
          kill "$FLUXBOX_PID" 2>/dev/null || true

          exit $TEST_EXIT
          ATSPISCRIPT

          chmod +x /tmp/run-atspi-test.sh
          dbus-run-session -- /tmp/run-atspi-test.sh
          RESULT=$?
          kill "$XVFB_PID" 2>/dev/null || true
          exit $RESULT

      - name: Upload AT-SPI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-diagnostics
          path: |
            /tmp/keepassxc.log
            /tmp/keepassxc-gdb.txt
            /tmp/at-spi-bus-launcher.log
            /tmp/at-spi-registryd.log
            /tmp/xvfb.log
            /tmp/atspi-test-results.xml
            /tmp/core*
          if-no-files-found: ignore
